# Weekly: checks whether the catalog has plugins with screenshots that the Plugin Manager's skin has no thumbnail for (they show initials until
# the next release), and if so pushes a branch with the new thumbnails and opens a PR (or an issue with a compare link: this repo does not let
# Actions create pull requests). It never releases anything; a person reviews it and runs the Plugin Manager release workflow.
name: Plugin Manager thumbnails
on:
  schedule:
    - cron: '23 4 * * 1'   # Mondays 04:23 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      # vst/shots.py reads the catalog entries (catalog/plugins/*.json) of open-mpc/mpc-vst-plugins: its newest main, since the
      # point is to find plugins added since the last build. Cloned outside the workspace, so thumbs_check.sh's "git add -A" cannot pick it up.
      - name: The live catalog
        run: git clone -q --depth 1 https://github.com/open-mpc/mpc-vst-plugins.git "$RUNNER_TEMP/mpc-vst-plugins"
      - name: Regenerate the thumbnails; open a PR or an issue if there are new ones
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MPC_VST: ${{ runner.temp }}/mpc-vst-plugins
        run: vst/thumbs_check.sh
